; One block per rsync transfer. Order here is the order transfers run in.
; Section name is used as the display label in logs and the summary.
;
; Keys:
;   source      - path relative to the project root on DEV. Blank means
;                 the project root itself. Include a trailing slash for
;                 anything that should sync as a directory's CONTENTS
;                 (rsync's own trailing-slash convention); omit it for a
;                 single file or to sync a directory as a named entry.
;   destination - path relative to the project root on PROD. Same rules
;                 as source.
;   filter      - "true" to apply rsync-filter.txt to this transfer.
;                 Omit, or anything other than "true", to skip it.
;
; Lines starting with ; or # are comments.

[main project files]
source =
destination =
filter = true

[vendor/]
source = var/deploy/vendor/
destination = vendor/

[var/cache]
source = var/deploy/var-cache/
destination = var/cache/

[assets/vendor]
source = var/deploy/assets-vendor/
destination = assets/vendor/

[.env.local.php]
source = var/deploy/.env.local.php
destination = .env.local.php
