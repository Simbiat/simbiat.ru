; One block per docker compose service. Section name must match the
; compose service name exactly.
;
; rebuild = a path (substring match against the changed file's path)
;           that means this service must be rebuilt and recreated
; restart = a path that means this service must be restarted, with no
;           rebuild (e.g. a mounted config file, not something baked
;           into the image)
;
; Both keys can repeat within one block. Lines starting with ; or #
; are comments. Matching is substring-based: "build/docker/frankenphp/"
; matches any file under that folder, at any depth.

[crowdsec]
rebuild = build/docker/crowdsec/
restart = config/CoreRuleSet/
restart = config/crowdsec/acquis.yaml
restart = config/crowdsec/config.yaml
restart = config/crowdsec/online_api_credentials.yaml
restart = config/crowdsec/acquis.d/
restart = config/crowdsec/appsec-configs/simbiat-appsec.yaml
restart = config/crowdsec/appsec-rules/simbiat-seclang.yaml

[frankenphp]
rebuild = build/docker/frankenphp/
restart = config/php.ini
restart = config/mime.types

[geoip]
rebuild = build/docker/geoip/

[mariadb]
rebuild = build/docker/mariadb/
restart = config/my.cnf

[phpmyadmin]
rebuild = build/docker/phpmyadmin/
restart = config/phpmyadmin.php

[postfix]
rebuild = build/docker/postfix/

[socket-proxy]
rebuild = build/docker/socket-proxy/

[supercronic]
rebuild = build/docker/supercronic/


; add one block per remaining service (bun, caddy-only containers,
; etc.), even if a service only ever needs "restart" or only "rebuild".
; A service with no block at all is still known to the script only if
; it appears as a section header somewhere in this file — an empty
; block (just "[service-name]" with no keys) is enough to register it
; for the "restart all known services" prompt.
