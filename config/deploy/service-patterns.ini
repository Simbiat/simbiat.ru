; One block per docker compose service. Section name must match the
; compose service name exactly.
;
; rebuild = one path, or several separated by commas (substring match
;           against the changed file's path) — means this service must
;           be rebuilt and recreated
; restart = same, but means this service must be restarted, with no
;           rebuild (e.g. a mounted config file, not something baked
;           into the image)
;
; Each key appears at most once per section. Lines starting with ; or #
; are comments. Matching is substring-based: "build/docker/frankenphp/"
; matches any file under that folder, at any depth.
;
; A service with no block at all is still known to the script only if
; it appears as a section header somewhere in this file — an empty
; block (just "[service-name]" with no keys) is enough to register it
; for the "restart all known services" prompt.

[crowdsec]
rebuild = build/docker/crowdsec/
restart = config/CoreRuleSet/, config/crowdsec/acquis.yaml, config/crowdsec/config.yaml, config/crowdsec/online_api_credentials.yaml, config/crowdsec/acquis.d/, config/crowdsec/appsec-configs/simbiat-appsec.yaml, config/crowdsec/appsec-rules/simbiat-seclang.yaml

[frankenphp]
rebuild = build/docker/frankenphp/
restart = config/php.ini, config/mime.types

[geoip]
rebuild = build/docker/geoip/

[mariadb]
rebuild = build/docker/mariadb/
restart = config/my.cnf

[phpmyadmin]
rebuild = build/docker/phpmyadmin/
restart = config/phpmyadmin.php

[postfix]
rebuild = build/docker/postfix/

[socket-proxy]
rebuild = build/docker/socket-proxy/

[supercronic]
rebuild = build/docker/supercronic/
