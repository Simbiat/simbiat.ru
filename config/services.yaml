# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    .container.dumper.inline_factories: true
    debug.container.dump: false

    # Mail for admin of the service
    app.admin_email: "%env(ADMIN_EMAIL)%"
    # Name of the admin
    app.admin_name: "Dmitrii Kustov"
    # Name of the website
    app.site_name: "Simbiat Software"
    # Mail to use to send emails from
    app.from_email: "%env(PROTON_USER)%"
    app.security_settings: "%kernel.project_dir%/data/security.json"
    app.base_url: 'https://%app.http_host%'
    # Section ID to be used for the contact form
    app.support_section: 26
    # List of system group IDs
    app.group_ids:
        Administrators: 1
        Unverified: 2
        Users: 3
        Deleted: 4
        Banned: 5
        Linked to FF: 6
        Bots: 7
    app.cookie_settings:
        path: '/'
        domain: '%app.domain%'
        secure: true
        httponly: true
        samesite: 'Strict'
        partitioned: true

    # Common directories. Use a trailing slash.
    app.directories.sitemap: "%kernel.project_dir%/var/sitemap/"
    # Path where JS files are stored
    app.directories.js: "%kernel.project_dir%/public/assets/"
    # Path where CSS files are stored
    app.directories.css: "%kernel.project_dir%/public/assets/styles/"
    # Path where images stored
    app.directories.images: "%kernel.project_dir%/public/assets/images/"
    # Path to uploaded files
    app.directories.uploaded: "%kernel.project_dir%/data/uploaded/"
    # Path to uploaded images
    app.directories.uploaded_images: "%kernel.project_dir%/data/uploadedimages/"
    # Folder to dump DDLs to
    app.directories.ddl: "%kernel.project_dir%/build/DDL/"
    app.directories.html_cache: "%kernel.project_dir%/data/temp/html/"
    app.directories.geoip: "/geoip/"

    # FFXIV directories. Use a trailing slash.
    app.directories.ffxiv.crests.components: "%kernel.project_dir%/public/assets/images/fftracker/crests-components/"
    app.directories.ffxiv.crests.cache: "%kernel.project_dir%/var/mergedcrests/"
    app.directories.ffxiv.icons: "%kernel.project_dir%/public/assets/images/fftracker/icons/"
    app.directories.ffxiv.statistics: "%kernel.project_dir%/data/ffstatistics/"

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    Symfony\Component\Dotenv\Command\DotenvDumpCommand: ~
