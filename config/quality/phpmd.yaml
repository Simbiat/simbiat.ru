name: "PHPMD rule set"
description: "Custom PHP MD ruleset"
path: "/app"
exclude-pattern:
    - "/app/assets/*"
    - "/app/bin/console"
    - "/app/bin/phpunit"
    - "/app/build/*"
    - "/app/config/bundles.php"
    - "/app/config/preload.php"
    - "/app/config/reference.php"
    - "/app/data/*"
    - "/app/node_modules/*"
    - "/app/packages/DDCIcons/icons/*"
    - "/app/public/*"
    - "/app/var/*"
    - "/app/vendor/*"

rules:
    -   ref: rulesets/cleancode.xml
        exclude:
            # Conflicts with some sniffs that for FQN global calls without the `use`
            - MissingImport
            # These seem too opinionated
            - StaticAccess
            - BooleanArgumentFlag
            - ElseExpression
    -   ref: rulesets/codesize.xml
        exclude:
            - CyclomaticComplexity
            - ExcessiveMethodLength
            - NPathComplexity
            - ExcessiveClassComplexity
    -   ref: rulesets/controversial.xml
        exclude:
            - CamelCaseVariableName
            - CamelCaseParameterName
            - CamelCasePropertyName
            # Duplicates SlevomatCodingStandard.Variables.DisallowSuperGlobalVariable
            - Superglobals
    -   ref: rulesets/design.xml
    -   ref: rulesets/naming.xml
        exclude:
            # These are handled by IDE, and are also not critical
            - ShortVariable
            - LongVariable
    -   ref: rulesets/unusedcode.xml
