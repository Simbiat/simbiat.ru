doctrine:
    dbal:
        connections:
            default:
                # IMPORTANT: You MUST configure your server version,
                # either here or in the DATABASE_URL env var (see .env file)
                #server_version: '16'
                url: '%env(resolve:DATABASE_URL)%'
                options:
                    !php/const Pdo\Mysql::ATTR_FOUND_ROWS: true
                    !php/const PDO::ATTR_TIMEOUT: 1
                    !php/const Pdo\Mysql::ATTR_INIT_COMMAND: |
                        SET SESSION character_set_client = 'utf8mb4',
                        SESSION collation_connection = 'utf8mb4_0900_as_cs',
                        SESSION character_set_connection = 'utf8mb4',
                        SESSION character_set_database = 'utf8mb4',
                        SESSION character_set_results = 'utf8mb4',
                        SESSION character_set_server = 'utf8mb4',
                        SESSION time_zone='+00:00'
                default_table_options:
                    # Affects schema-tool
                    charset: utf8mb4
                    collation: utf8mb4_0900_as_cs
                    engine: InnoDB
                profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
