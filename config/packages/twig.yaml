twig:
    file_name_pattern: '*.twig'
    strict_variables: true
    auto_reload: true
    date:
        timezone: 'UTC'
    paths:
        '%kernel.project_dir%/public/assets/images': 'images'
        '%kernel.project_dir%/public/assets/styles': 'styles'

when@prod:
    twig:
        cache: true

when@dev:
    twig:
        cache: false

when@test:
    twig:
        cache: false
