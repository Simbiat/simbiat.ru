[global]
# Docker Configuration
# The Docker daemon address comes from the DOCKER_HOST environment variable
# (default unix:///var/run/docker.sock) — there is no INI key for it.
# Event/polling settings (events, docker-poll-interval, ...) belong in the
# [docker] section — see "Docker label configurations" in the README.
allow-host-jobs-from-labels = false
# Default for exec/run/service; empty uses container default
default-user =

# How label-defined job-exec names are scoped (see "Cross-Container Job
# References" below). Default `service` is collision-prone when one daemon
# watches several Compose projects that reuse a service name; use `container`
# or `container-service` to keep them distinct.
#   service           - {service}.{job} (default; falls back to container name)
#   container         - {container}.{job} (collision-safe per Docker daemon)
#   container-service - {container}.{service}.{job} (descriptive + collision-safe)
job-exec-label-scope = service

# Notification deduplication: suppress duplicate error notifications (Slack, email,
# save) for jobs that fail repeatedly with the same error. Set to 0 (default) to
# disable deduplication and emit every notification. Accepts any Go duration
# (`5m`, `1h`, `30s`).
notification-cooldown = 1h

# Email Settings
email-from = noreply@simbiat.eu
email-to = admin@simbiat.eu
smtp-host = ${PROTON_HOST}
smtp-port = ${PROTON_PORT}
smtp-user = ${PROTON_USER}
smtp-password = ${PROTON_PASSWORD}
# Skip TLS certificate verification when dialing the SMTP server. Default: false.
# WARNING: Disables MITM protection — only enable for test environments or when
# the SMTP server uses a private/internal CA that cannot be trusted system-wide.
# See docs/TROUBLESHOOTING.md for the security trade-off.
# smtp-tls-skip-verify = false
# STARTTLS posture for the outbound SMTP dialer. Default: mandatory.
# Valid values:
#   mandatory     - Require STARTTLS; abort with an error if the server does not advertise it.
#                   This is the default and prevents silent cleartext fallback.
#   opportunistic - Use STARTTLS when offered, silently fall back to plaintext otherwise.
#                   Use only with a fully trusted network path (e.g. localhost relay).
#   none          - Disable STARTTLS entirely; messages and credentials sent in cleartext.
#                   Required for some test fixtures (MailHog); intentionally insecure.
# See docs/TROUBLESHOOTING.md for the rationale and the security trade-offs.
smtp-tls-policy = mandatory

# Output Settings
save-folder = /var/log/ofelia
save-only-on-error = true
slack-only-on-error = true
mail-only-on-error = true

# Web UI Settings
enable-web = true
# Bind to localhost by default to avoid exposing the web UI to untrusted networks.
# Change only when you have proper network access controls in place.
web-address = 0.0.0.0:8080
# Auth is not used, since not exposed to the world
web-auth-enabled = false
web-password-hash = not_used  # bcrypt hash - use 'ofelia hash-password' to generate
web-secret-key = not_used  # Required for persistent sessions across restarts
web-trusted-proxies = 172.21.0.0/16, 2001:db8:1::/64

# Security
enable-strict-validation = true

log-level = INFO

[job-exec "php-healthcheck"]
schedule = * * * * *
container = frankenphp
command = /app/bin/php-healthcheck.sh

[job-exec "php-minute"]
schedule = * * * * *
container = frankenphp
command = /app/bin/php-minute.sh

[job-exec "php-mailer"]
schedule = * * * * *
container = frankenphp
command = /app/bin/php-mailer.sh

[job-exec "php-cron"]
schedule = @every 20s
container = frankenphp
command = /app/bin/php-cron.sh

[job-exec "php-day"]
schedule = 30 1 * * *
container = frankenphp
command = /app/bin/php-day.sh

[job-exec "php-month"]
schedule = 30 0 28 * *
container = frankenphp
command = /app/bin/php-month.sh

[job-exec "mariadb-backup"]
schedule = 0 3 * * *
container = mariadb
command = /etc/mysql/cron/mariadb-backup.sh

[job-exec "mariadb-log-rotate"]
schedule = @midnight
container = mariadb
command = /etc/mysql/cron/mariadb-log-rotate.sh

[job-exec "geoip-update"]
schedule = @daily
container = geoip
command = /usr/bin/geoipupdate --output

[job-exec "ofelia-log-rotate"]
schedule = @midnight
container = ofelia
command = /etc/ofelia/cron/ofelia-log-rotate.sh