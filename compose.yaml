# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json
name: simbiat-dev

networks:
  default:
  docker:
    driver: bridge
    internal: true
  smtp:
    driver: bridge
    internal: true
  crowdsec:
    driver: bridge

volumes:
  caddy_config:
    driver: local
  caddy_data:
    driver: local
  crowdsec_config:
    driver: local
  crowdsec_data:
    driver: local
  geoip_data:
    driver: local
  mariadb_socket:
    driver: local
  mariadb_temp:
    driver: local
  postfix_etc:
    driver: local
  postfix_lib:
    driver: local
  postfix_mail:
    driver: local
  postfix_spool:
    driver: local
  postfix_dkim_keys:
    driver: local

services:
  phpmyadmin:
    extends:
      file: ./build/docker/phpmyadmin/compose.yaml
      service: phpmyadmin

  geoip:
    extends:
      file: ./build/docker/geoip/compose.yaml
      service: geoip

  frankenphp:
    extends:
      file: ./build/docker/frankenphp/compose.yaml
      service: frankenphp

  crowdsec:
    extends:
      file: ./build/docker/crowdsec/compose.yaml
      service: crowdsec

  mariadb:
    extends:
      file: ./build/docker/mariadb/compose.yaml
      service: mariadb

  socket-proxy:
    extends:
      file: ./build/docker/socket-proxy/compose.yaml
      service: socket-proxy

  supercronic:
    extends:
      file: ./build/docker/supercronic/compose.yaml
      service: supercronic

  postfix:
    extends:
      file: ./build/docker/postfix/compose.yaml
      service: postfix

  # Note that PHPStorm starts this container and keeps it open as long as any JS/TS service is running.
  # Whether that's a bug or not is unclear, but tracked in https://youtrack.jetbrains.com/issue/WEB-73725 and https://youtrack.jetbrains.com/issue/WEB-73722
  bun:
    # Command is required in case some manual runs are needed, since PHPStorm stops the container right away (uses "run").
    # Alternatively, open any TS file in PHPStorm, and then use the container it creates
    #command: tail -f /dev/null
    extends:
      file: ./build/docker/bun/compose.yaml
      service: bun
