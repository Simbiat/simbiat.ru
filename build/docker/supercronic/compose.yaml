# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json
services:
  supercronic:
    build:
      args:
        PUID: ${HOST_UID}
        PGID: ${HOST_GID}
      context: ../../../build/docker/supercronic
      dockerfile: Dockerfile
    cap_drop:
      - ALL
    container_name: supercronic
    depends_on:
      socket-proxy:
        condition: service_healthy
      geoip:
        condition: service_healthy
      frankenphp:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    environment:
      #Address of docker socker proxy
      DOCKER_HOST: tcp://socket-proxy:2375
    networks:
      - ofelia-internal
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - ../../../bin:/etc/supercronic/bin:ro
      - ../../../config:/etc/supercronic/config:ro
      - ../../../logs:/var/log:rw
    command: tail -f /dev/null