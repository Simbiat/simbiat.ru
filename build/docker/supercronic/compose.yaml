# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json
services:
  supercronic:
    build:
      args:
        PUID: ${HOST_UID}
        PGID: ${HOST_GID}
      context: ../../../build/docker/supercronic
      dockerfile: Dockerfile
    cap_drop:
      - ALL
    container_name: supercronic
    depends_on:
      socket-proxy:
        condition: service_healthy
      postfix:
        condition: service_healthy
    networks:
      - docker
      - smtp
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - ../../../bin:/etc/supercronic/bin:ro
      - ../../../config:/etc/supercronic/config:ro
      - ../../../.env:/etc/supercronic/.env:ro
      - ../../../var/log:/var/log:rw
      #Volumes mounted for daily cleaning
      - ../../../data/temp:/to_clean/temp
      - ../../../var/mergedcrests:/to_clean/crests
