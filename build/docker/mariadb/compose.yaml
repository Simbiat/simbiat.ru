# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json
services:
  mariadb:
    build:
      args:
        MARIADB_VERSION: ${DATABASE_VERSION}
        PUID: ${HOST_UID}
        PGID: ${HOST_GID}
      context: ../../../build/docker/mariadb
      dockerfile: Dockerfile
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - FOWNER
    cap_drop:
      - ALL
    container_name: mariadb
    environment:
      #Pass database name for backup
      DATABASE_NAME: ${DATABASE_NAME}
      #Password for backups created by CRON job
      MARIADB_BACKUP_PASSWORD: ${MARIADB_BACKUP_PASSWORD}
    network_mode: none
    # Help avoid killing the database, it's better if FrankenPHP (second main consumer) gets restarted.
    oom_score_adj: -500
    ports:
      - "127.0.0.1:3306:3306"
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    tmpfs:
      - /run
    volumes:
      #RW for the socket
      - mariadb_socket:/run/mysqld:rw
      #RO for config
      - ../../../config:/etc/mysql/conf.d:ro
      #RW for database files directory
      - ../../../data/mariadb:/var/lib/mysql:rw
      #Using tmpfs for /tmp is not a good idea, since it's used during various operations on large tables
      - mariadb_temp:/tmp:rw
      #RW for logs directory
      - ../../../var/log:/usr/local/logs:rw
      #RW for backups directory
      - ../../../data/backups:/usr/local/backups:rw
      #CRON scripts:
      - ../../../bin:/etc/mysql/cron:ro
