# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json
services:
  crowdsec:
    #Based on https://github.com/crowdsecurity/example-docker-compose/tree/main/caddy
    build:
      args:
        PUID: ${HOST_UID}
        PGID: ${HOST_GID}
      context: ../../../build/docker/crowdsec
      dockerfile: Dockerfile
    cap_drop:
      - ALL
    container_name: crowdsec
    depends_on:
      geoip:
        condition: service_healthy
    environment:
      BOUNCER_KEY_CADDY: ${CROWDSEC_CADDY_KEY}
      BOUNCER_KEY_IPTABLES: ${CROWDSEC_IPTABLES_KEY}
      ENROLL_KEY: ${CROWDSEC_ENROLL_KEY}
    group_add:
      - 4
    networks:
      - default
      - crowdsec
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:6060:6060"
      - "127.0.0.1:7422:7422"
      #These are valid despite the IDE highlighting them. https://youtrack.jetbrains.com/issue/IJPL-228615
      - "[::1]:8080:8080"
      - "[::1]:6060:6060"
      - "[::1]:7422:7422"
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    tmpfs:
      - /tmp
      - /run
    volumes:
      #Data folder is required to be mounted, otherwise container does not start
      - crowdsec_config:/etc/crowdsec:rw
      - crowdsec_data:/var/lib/crowdsec/data:rw
      - ../../../config/CoreRuleSet:/var/lib/crowdsec/data/CoreRuleSet:ro
      #Mount config files (need to mount as RW due to CHOWN, that has to run on them)
      - ../../../config/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ../../../config/crowdsec/config.yaml.local:/etc/crowdsec/config.yaml.local:ro
      - ../../../config/crowdsec/online_api_credentials.yaml:/etc/crowdsec/online_api_credentials.yaml:ro
      - ../../../config/crowdsec/acquis.d:/etc/crowdsec/acquis.d:ro
      - ../../../config/crowdsec/appsec-configs/simbiat-appsec.yaml:/etc/crowdsec/appsec-configs/simbiat-appsec.yaml:ro
      - ../../../config/crowdsec/appsec-rules/simbiat-seclang.yaml:/etc/crowdsec/appsec-rules/simbiat-seclang.yaml:ro
      #RO for GeoLite2 files
      - geoip_data:/geoip:ro
      #Required to read syslog. This will be valid only on UNIX
      - /var/log/:/var/log/:ro
      #Caddy logs folder is RW, because we're also writing Crowdsec logs here
      - ../../../var/log:/usr/local/logs/:rw
