# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/master/schema/compose-spec.json
services:
  ofelia:
    build:
      args:
        PUID: ${HOST_UID}
        PGID: ${HOST_GID}
      context: ../../../build/docker/ofelia
      dockerfile: Dockerfile
    cap_drop:
      - ALL
    container_name: ofelia
    depends_on:
      socket-proxy:
        condition: service_healthy
      geoip:
        condition: service_healthy
      frankenphp:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    environment:
      #Address of docker socker proxy
      DOCKER_HOST: tcp://socket-proxy:2375
      #Settings for email notifications
      PROTON_HOST: ${PROTON_HOST}
      PROTON_PASSWORD: ${PROTON_PASSWORD}
      PROTON_PORT: ${PROTON_PORT}
      PROTON_USER: ${PROTON_USER}
    networks:
      - ofelia-internal
    ports:
      - "127.0.0.1:7486:8080"
      - "[::1]:7486:8080"
    #read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - ../../../logs:/var/log:rw
      - ../../../bin:/etc/ofelia/cron:ro
      - ../../../config:/etc/ofelia/config:ro